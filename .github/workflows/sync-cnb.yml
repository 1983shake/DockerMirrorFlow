name: Sync to CNB and Create Release

on:
  push:
    branches: [main]
    tags: ['release-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CNB_REPO: cnb.cool/1983shake/DockerMirrorFlow.git

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git and CNB remote
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git remote add cnb https://cnb:${{ secrets.GIT_PASSWORD }}@${{ env.CNB_REPO }} || \
            git remote set-url cnb https://cnb:${{ secrets.GIT_PASSWORD }}@${{ env.CNB_REPO }}

      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/release-v')
        run: |
          VERSION=${GITHUB_REF_NAME#release-v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Push main branch to CNB
        if: github.ref == 'refs/heads/main'
        run: git push cnb HEAD:main --force

      - name: Push tags to CNB
        if: startsWith(github.ref, 'refs/tags/release-v')
        run: git push cnb --tags --force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/release-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DockerMirrorFlow_V${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
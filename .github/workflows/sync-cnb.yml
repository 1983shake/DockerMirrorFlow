name: Sync to CNB and Create Release
on:
  push:
    branches: [main]
    tags: ['release-v*']
  workflow_dispatch:

permissions:
  contents: write   # 必须添加，否则无法创建 Release

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push to CNB
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git remote add cnb https://cnb:${{ secrets.GIT_PASSWORD }}@cnb.cool/1983shake/DockerMirrorFlow.git
          git push cnb HEAD:main
          git push cnb --tags --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/release-v')
        with:
          tag_name: ${{ github.ref_name }}
          name: DockerMirrorFlow_V${{ github.ref_name }}
          generate_release_notes: true
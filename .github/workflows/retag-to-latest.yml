name: Retag ACR Image to Latest

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要拉取的镜像版本标签（如 v1.2.3）'
        required: true
        type: string

env:
  ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
  IMAGE_NAME: my-app        # ← 改成你的镜像仓库名

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Pull, Retag and Push
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          FULL_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}"

          echo "==> 拉取 ${FULL_IMAGE}:${VERSION}"
          docker pull "${FULL_IMAGE}:${VERSION}"

          echo "==> 打标签 ${FULL_IMAGE}:latest"
          docker tag "${FULL_IMAGE}:${VERSION}" "${FULL_IMAGE}:latest"

          echo "==> 推送 ${FULL_IMAGE}:latest"
          docker push "${FULL_IMAGE}:latest"

          echo "==> 完成"
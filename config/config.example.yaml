# ============================================================
#  DockerMirrorFlow 配置文件
#  多源聚合，流式加速 —— 多 Registry 镜像代理加速服务
# ============================================================

app:
  name: "DockerMirrorFlow"
  tagline: "多源聚合，流式加速"

server:
  host: "0.0.0.0"
  port: 8000
  workers: 2
  debug: false

admin:
  user: "admin"
  pass: "change_me"

proxy:
  timeout: 10.0
  max_redirects: 5
  stream_chunk_size: 1048576
  candidate_count: 3
  fail_cooldown: 60
  realtime_probe: false
  probe_timeout: 2.0

access:
  ip_whitelist: []
  image_whitelist_regex: ""
  image_blacklist_regex: ""

auto_fetch:
  enabled: true
  interval_minutes: 60
  api_url: "https://status.anye.xyz"
  registry_types:
    - hub
    - ghcr
    - quay
    - mcr
    - gcr
    - elastic
    - nvcr
  filters:
    selectable: true
    access: "public"

health_check:
  interval_minutes: 30
  timeout_seconds: 5
  latency_threshold: 500
  disable_threshold: 9999
  concurrent_batch: 5
  auto_recover: true
  recover_after_minutes: 120

manually_disabled: []

custom_nodes: []

route_aliases: {}

# ============================================================
#  搜索配置（Web UI 的"搜索 & 拉取 Docker 镜像"功能）
# ============================================================
#  前端会优先让浏览器直接访问 hub.docker.com 搜索。
#  如果浏览器所在网络也访问不了，会调用后端 /api/search。
#  后端会依次尝试下面 upstreams 里的 URL。
#
#  ⚠️ 注意：Docker 镜像加速节点（DaoCloud、南大等）只代理
#     /v2/ registry 协议，不提供搜索 API。所以要在这里填
#     一个能访问 hub.docker.com 的搜索代理地址。
#
#  常见可选 upstream:
#    - 内网 HTTP 代理（如公司/机房的出网代理）
#    - 自己部署的 nginx 反代: http://your-nginx/hub-search
#    - 能访问 Docker Hub 的第三方搜索 API
#
search:
  enabled: true
  page_size: 25
  timeout: 10.0
  upstreams: []
  # 示例：
  # upstreams:
  #   - name: "内网出网代理"
  #     url: "http://192.168.1.10:8080/proxy/hub-search"
  #   - name: "备用镜像搜索"
  #     url: "https://some-search-mirror.example.com/v2/search/repositories/"

logging:
  level: "INFO"
  file: "data/dockermirrorflow.log"
  max_bytes: 10485760
  backup_count: 5
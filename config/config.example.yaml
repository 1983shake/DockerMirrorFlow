# ============================================================
#  DockerMirrorFlow 配置文件
#  多源聚合，流式加速 —— 多 Registry 镜像代理加速服务
# ============================================================


# ------------------------------------------------------------
# 应用元信息
# ------------------------------------------------------------
app:
  name: "DockerMirrorFlow"
  tagline: "多源聚合，流式加速"


# ------------------------------------------------------------
# 服务器配置（修改后需要重启服务）
# ------------------------------------------------------------
server:
  host: "0.0.0.0"
  port: 8000
  debug: false


# ------------------------------------------------------------
# 管理后台认证
# ------------------------------------------------------------
admin:
  user: "admin"
  pass: "change_me"


# ------------------------------------------------------------
# 代理行为配置
# ------------------------------------------------------------
proxy:
  timeout: 10.0

  # 按路径类型的超时（秒）
  timeout_by_path:
    probe: 3.0
    manifests: 5.0
    blobs: 10.0

  max_redirects: 5
  stream_chunk_size: 1048576

  candidate_count: 5

  fail_cooldown: 60
  timeout_fail_cooldown: 300
  forbidden_fail_cooldown: 600
  server_err_fail_cooldown: 180

  realtime_probe: false
  probe_timeout: 2.0

  follow_redirects: true
  follow_redirects_max: 5
  follow_redirect_fail_cooldown: 300

  blob_fail_cooldown: 600

  prefer_recent_success: true
  recent_success_window: 300

  # 镜像级节点粘性窗口（秒）
  affinity_window: 300

  # /v2/ 心跳请求的节点粘性窗口（秒）
  probe_node_window: 600


# ------------------------------------------------------------
# 访问控制
# ------------------------------------------------------------
access:
  ip_whitelist: []
  image_whitelist_regex: ""
  image_blacklist_regex: ""


# ------------------------------------------------------------
# 节点自动拉取配置
# ------------------------------------------------------------
auto_fetch:
  enabled: true
  interval_minutes: 60
  api_url: "https://status.anye.xyz"
  registry_types:
    - hub
    - ghcr
    - quay
    - mcr
    - gcr
    - elastic
    - nvcr
  filters:
    selectable: true
    access: "public"


# ------------------------------------------------------------
# 活体检测与测速配置
# ------------------------------------------------------------
health_check:
  interval_minutes: 30
  timeout_seconds: 5
  latency_threshold: 500
  disable_threshold: 9999
  concurrent_batch: 5
  auto_recover: true
  recover_after_minutes: 120

  # 按 registry 类型的测试镜像（完整 manifests 路径）
  # 会拼到 {registry}/v2/ 后面请求，要求真实存在且公开可访问
  # 严格校验：只有 200/401 才算通过，404 会判为节点故障
  # 若某类型留空字符串 ""，则跳过 manifests 检查，仅用 /v2/ 判断存活
  test_images_by_type:
    dockerhub: "library/alpine/manifests/latest"
    ghcr:      "stefanprodan/podinfo/manifests/latest"
    gcr:       "distroless/static/manifests/latest"
    quay:      "prometheus/prometheus/manifests/latest"
    mcr:       "hello-world/manifests/latest"
    elastic:   "beats/filebeat/manifests/latest"
    nvcr:      "nvidia/cuda/manifests/latest"
    # 如需为其他自定义 registry_type 指定测试镜像，在此添加


# ------------------------------------------------------------
# 手动禁用节点列表
# ------------------------------------------------------------
manually_disabled: []


# ------------------------------------------------------------
# 自定义节点
# ------------------------------------------------------------
custom_nodes: []


# ------------------------------------------------------------
# 路由别名
# ------------------------------------------------------------
route_aliases: {}


# ------------------------------------------------------------
# 搜索配置
# ------------------------------------------------------------
search:
  enabled: true
  page_size: 25
  timeout: 10.0
  upstreams: []


# ------------------------------------------------------------
# 日志配置（修改后需要重启服务）
# ------------------------------------------------------------
logging:
  level: "INFO"
  file: "data/dockermirrorflow.log"
  max_bytes: 10485760
  backup_count: 5

  # 第三方库日志级别（httpx / httpcore / apscheduler / uvicorn.access）
  # 可选值：
  #   "DEBUG"    - 打印所有 HTTP 请求（生产环境噪音巨大，仅调试用）
  #   "INFO"     - 打印所有 HTTP 请求（httpx 默认级别）
  #   "WARNING"  - 只打印失败请求（推荐，避免日志膨胀）
  #   "ERROR"    - 只打印错误
  #   "CRITICAL" - 几乎不打印
  third_party_level: "WARNING"
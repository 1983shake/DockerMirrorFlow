$:
  tag_push:
    - tags:release-v*          # 仅匹配 release-v 开头的 Tag，与你截图中的规则保持一致
      services:
        - docker
      stages:
        - name: docker build
          script: |
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            # 剥离 release-v 前缀，将 release-v1.0.0 转换成 1.0.0
            VERSION=$(echo "${CNB_BRANCH}" | sed 's/^release-v//')
            echo "正在构建版本: ${VERSION}"
            docker build \
              -t "${IMAGE_BASE}:${VERSION}" \
              -t "${IMAGE_BASE}:latest" \
              .

        - name: docker push
          script: |
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION=$(echo "${CNB_BRANCH}" | sed 's/^release-v//')
            docker push "${IMAGE_BASE}:${VERSION}"
            docker push "${IMAGE_BASE}:latest"
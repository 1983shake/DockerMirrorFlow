$:
  tag_push:
    - tags: "release-v*"
      services:
        - docker
      stages:
        # 步骤 1：生成 changelog（供 Release 描述使用）
        - name: changelog
          image: cnbcool/changelog
          exports:
            latestChangeLog: LATEST_CHANGE_LOG

        # 步骤 2：创建 Release
        - name: create release
          type: git:release
          options:
            # title: "Release ${CNB_BRANCH}"
            title: "DockerMirrorFlow_V${CNB_BRANCH}"
            description: ${LATEST_CHANGE_LOG}

        # 步骤 3：构建 Docker 镜像
        - name: docker build
          script: |
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION=$(echo "${CNB_BRANCH}" | sed 's/^release-v//')
            echo "正在构建版本: ${VERSION}"
            docker build \
              -t "${IMAGE_BASE}:${VERSION}" \
              -t "${IMAGE_BASE}:latest" \
              .

        # 步骤 4：推送 Docker 镜像
        - name: docker push
          script: |
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION=$(echo "${CNB_BRANCH}" | sed 's/^release-v//')
            docker push "${IMAGE_BASE}:${VERSION}"
            docker push "${IMAGE_BASE}:latest"
$:
  tag_push:
    - tags: "release-v*"
      services:
        - docker
      stages:
        # 步骤 1：生成 changelog（允许失败，不阻断后续流程）
        - name: changelog
          image: cnbcool/changelog
          allow_failure: true
          exports:
            latestChangeLog: LATEST_CHANGE_LOG

        # 步骤 2：提取纯版本号并导出为环境变量 VERSION
        - name: set version
          script: |
            VERSION="${CNB_BRANCH#release-v}"
            echo "VERSION=${VERSION}"
          exports:
            version: VERSION

        # 步骤 3：创建 Release
        - name: create release
          type: git:release
          options:
            title: "DockerMirrorFlow_V${VERSION}"
            description: "${LATEST_CHANGE_LOG}"

        # 步骤 4：构建并推送 Docker 镜像（合并为一个步骤）
        - name: docker build and push
          script: |
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            echo "正在构建版本: ${VERSION}"
            docker build \
              -t "${IMAGE_BASE}:${VERSION}" \
              -t "${IMAGE_BASE}:latest" \
              .
            docker push "${IMAGE_BASE}:${VERSION}"
            docker push "${IMAGE_BASE}:latest"
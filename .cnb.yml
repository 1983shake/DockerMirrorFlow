$:
  tag_push:
    - tags: "release-v*"
      services:
        - docker
      stages:
        # 步骤 1：生成 changelog
        - name: changelog
          image: cnbcool/changelog
          allow_failure: true
          exports:
            latestChangeLog: LATEST_CHANGE_LOG

        # 步骤 2：计算版本号并导出（脚本输出键名与导出变量名区分开）
        - name: set version
          script: |
            VERSION="${CNB_BRANCH#release-v}"
            echo "MY_VERSION=${VERSION}"
          exports:
            VERSION: MY_VERSION

        # 步骤 3：创建 Release（通过 env 显式传递变量）
        - name: create release
          type: git:release
          env:
            VERSION: "${VERSION}"
            LATEST_CHANGE_LOG: "${LATEST_CHANGE_LOG}"
          options:
            title: "DockerMirrorFlow_V${VERSION}"
            description: "${LATEST_CHANGE_LOG}"

        # 步骤 4：构建并推送 Docker 镜像
        - name: docker build and push
          script: |
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${VERSION:-${CNB_BRANCH#release-v}}"
            echo "正在构建版本: ${VERSION}"
            docker build \
              -t "${IMAGE_BASE}:${VERSION}" \
              -t "${IMAGE_BASE}:latest" \
              .
            docker push "${IMAGE_BASE}:${VERSION}"
            docker push "${IMAGE_BASE}:latest"
$:
  tag_push:
    - tags: "release-v*"
      services:
        - docker
      stages:
        # 步骤 1：生成 changelog（允许失败，不影响后续构建）
        - name: changelog
          image: cnbcool/changelog
          allow_failure: true
          exports:
            LATEST_CHANGE_LOG: latestChangeLog   # 明确映射为全大写环境变量

        # 步骤 2：提取纯版本号并导出为环境变量 VERSION
        - name: set version
          script: |
            VERSION="${CNB_BRANCH#release-v}"
            echo "VERSION=${VERSION}"
          exports:
            VERSION: VERSION   # 键名改为大写，与后续引用保持一致

        # 步骤 3：创建 Release
        - name: create release
          type: git:release
          env:
            VERSION: $VERSION                  # 显式传递变量给插件
            LATEST_CHANGE_LOG: $LATEST_CHANGE_LOG
          options:
            title: "DockerMirrorFlow_V${VERSION}"
            description: "${LATEST_CHANGE_LOG}"

        # 步骤 4：构建并推送 Docker 镜像（合并步骤，增加回退逻辑）
        - name: docker build and push
          script: |
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            # 回退逻辑：如果 VERSION 为空，则直接从分支名计算
            VERSION="${VERSION:-${CNB_BRANCH#release-v}}"
            echo "正在构建版本: ${VERSION}"
            docker build \
              -t "${IMAGE_BASE}:${VERSION}" \
              -t "${IMAGE_BASE}:latest" \
              .
            docker push "${IMAGE_BASE}:${VERSION}"
            docker push "${IMAGE_BASE}:latest"